name: Corporate Compliance & CI

# Trigger on every Pull Request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:



jobs:
  quality-gate:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the code from the repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for better security scanning

      # 2. Setup Node.js (Adjust version for your tech stack)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Run Linting (Ensures code follows company style)
      - name: Run Linter
        run: npm run lint

      # 5. Security Scan (Looking for leaked secrets/keys)
      # This is a common corporate requirement
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # 6. Run Unit Tests
      - name: Run Tests
        run: npm test